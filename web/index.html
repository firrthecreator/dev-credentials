<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dev : Credential Validator</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/logo_light.png">
</head>
<body>
  <div class="app">
    <header class="navbar">
      <a href="./" class="nav-brand">
        <img src="assets/logo_light.png" alt="dev :" class="brand-logo dark-logo">
        <img src="assets/logo_dark.png" alt="dev :" class="brand-logo light-logo">
        <span class="nav-tag">Validator</span>
      </a>
      <div class="nav-actions">
        <button type="button" class="btn-theme" id="theme-toggle" aria-label="Toggle theme">
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="main-content">
      <section class="hero-section">
        <h1 class="hero-title">Credential Verification</h1>
        <p class="hero-desc">Verify post-quantum NIST FIPS 204 ML-DSA-65 membership credentials for dev : community.</p>
      </section>

      <section class="lookup-section">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Enter Credential ID, Legality ID, or member name"
            autocomplete="off"
            spellcheck="false"
          >
          <button type="button" id="search-clear" class="btn-clear" aria-label="Clear search" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </section>

      <section id="result-view" class="result-view"></section>
    </main>

    <footer class="app-footer">
      <div class="footer-top">
        <div class="footer-brand">
          <span class="footer-dot"></span>
          <span>NIST FIPS 204 ML-DSA-65 & SHA3-256</span>
        </div>
        <div class="footer-links">
          <a href="https://github.com/mrvlous/rivide" target="_blank" rel="noopener noreferrer" class="footer-link">
            <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
              <path d="M9 18c-4.51 2-5-2-7-2"/>
            </svg>
            <span>Rivide PQC</span>
          </a>
        </div>
      </div>
      <div class="footer-bottom">
        <span>dev : official credentials</span>
        <span class="meta-dot">/</span>
        <span>Authority: Moh. Ananda Firmansyah Putra</span>
      </div>
    </footer>
  </div>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="js/registry_data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
